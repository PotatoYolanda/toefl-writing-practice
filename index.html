function dayNum(d){ return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5); }
function isoToNum(s){ const [y,m,d]=s.split("-").map(Number); return Math.floor(Date.UTC(y,m-1,d)/864e5); }
function numToIso(n){ return new Date(n*864e5).toISOString().slice(0,10); }
function label(n){ const d=new Date(n*864e5); return `${d.getUTCMonth()+1}/${d.getUTCDate()} 周${"日一二三四五六"[d.getUTCDay()]}`; }
const TODAY = dayNum(new Date());
const HOLI = new Set(["2026-11-26","2026-12-24","2026-12-25","2027-01-01"].map(isoToNum));
const isRest = n => new Date(n*864e5).getUTCDay()===0 || HOLI.has(n);
function shift(n){ while(isRest(n)) n++; return n; }

const KEY="toefl-writing-v1";
let S={done:{},drafts:{},bas:{},drill:{},t:0};
const nMarks = d => Object.keys((d&&d.mark)||{}).length;
function merge(a,b){
  const o={done:{},drafts:{},bas:{},drill:{},t:Math.max(a.t||0,b.t||0)};
  for(const s of [a,b]){
    Object.assign(o.done, JSON.parse(JSON.stringify(s.done||{})));
    for(const k in (s.drafts||{})) if(!o.drafts[k] || (s.drafts[k]||"").length > o.drafts[k].length) o.drafts[k]=s.drafts[k];
    for(const k in (s.bas||{})) if(!o.bas[k] || (s.bas[k].score||0) >= (o.bas[k].score||0)) o.bas[k]=JSON.parse(JSON.stringify(s.bas[k]));
    for(const k in (s.drill||{})){
      const x=JSON.parse(JSON.stringify(s.drill[k]));
      if(!o.drill[k]) o.drill[k]=x;
      else{ const y=o.drill[k];
        o.drill[k] = nMarks(x)>=nMarks(y) ? {ans:Object.assign({},y.ans,x.ans),mark:x.mark} : {ans:Object.assign({},x.ans,y.ans),mark:y.mark}; }
    }
  }
  return o;
}

  saving=false; if(again){again=false;push();} }

/* ---------- 排词成句 ---------- */
function basHtml(setId, title){
  const items=BAS[setId], res=S.bas[setId];
  return `<div class="row"><span class="tag">${esc(title)}</span><span class="small">${res?`上次得分 ${res.score}/${items.length}`:`共 ${items.length} 题`}</span></div>
  <div class="small">读上面的问句，把词块点成正确顺序的回答。点错了可以点“重来”。</div>
  <div id="bas_${setId}"></div>`;
}
function startBas(setId){
  const items=BAS[setId]; let k=0, score=0, wrong=[];
  const box=$("bas_"+setId); if(!box) return;
  const show=()=>{
    if(k>=items.length){
      S.bas[setId]={score, wrong, day:TODAY}; save();
      box.innerHTML=`<div class="fb ${score===items.length?"good":"bad"}">得分 ${score}/${items.length}</div>
        ${wrong.length?`<div class="small">错题（复制给我，我帮你讲语序规则）：</div><div class="en">${wrong.map(w=>esc(w)).join("<br>")}</div>
        <div class="actions"><button class="primary" id="bcp">复制错题给 Claude</button><span class="small" id="bcpm"></span></div>`:""}
        <div class="actions"><button id="bre">再做一遍</button></div>`;
      if($("bcp")) $("bcp").onclick=()=>copy(`排词成句 ${setId} 错题：\n`+wrong.join("\n"), $("bcpm"));
      $("bre").onclick=()=>startBas(setId); return;
    }
    const [q,a]=items[k]; const words=a.split(" "); const pool=words.map((w,i)=>({w,i})).sort(()=>Math.random()-0.5); const picked=[];
    const draw=()=>{
      box.innerHTML=`<div class="small">第 ${k+1} / ${items.length} 题</div><div class="en">“${esc(q)}”</div>
      <div class="answer tiles" id="ans">${picked.map((p,j)=>`<span class="tile" data-back="${j}">${esc(p.w)}</span>`).join("")}</div>
      <div class="tiles">${pool.filter(p=>!picked.includes(p)).map(p=>`<button class="tile" data-pick="${p.i}">${esc(p.w)}</button>`).join("")}</div>
      <div class="actions"><button class="primary" id="bchk" ${picked.length<words.length?"disabled":""}>检查</button><button id="brs">重来</button></div><div id="bfb"></div>`;
      box.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ picked.push(pool.find(p=>p.i==b.dataset.pick)); draw(); });
      box.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{ picked.splice(+b.dataset.back,1); draw(); });
      $("brs").onclick=()=>{ picked.length=0; draw(); };
      $("bchk").onclick=()=>{
        const mine=picked.map(p=>p.w).join(" "); const ok=mine===a;
        if(ok) score++; else wrong.push(`${q} → 你的：${mine} ｜ 正确：${a}`);
        $("bfb").innerHTML=`<div class="fb ${ok?"good":"bad"}">${ok?"正确":"正确顺序"}<div class="en">${esc(a)}</div></div><div class="actions" style="margin-top:8px"><button class="primary" id="bnx">下一题</button></div>`;
        $("bchk").disabled=true; $("bnx").onclick=()=>{k++; show();}; $("bnx").focus();
      };
    };
    draw();
  };
  show();
}

function cardsFor(n){
  const p=PLAN[numToIso(n)]; if(!p) return "";
  const GW={g1:1,g2:1,g3:2,g4:2,g5:3,g6:3};
  const ids=Object.keys(GRAMMAR).filter(g=> p.w===4 ? true : (GW[g]===p.w && isoToNum(GRAMMAR[g].intro)<=n));
  // 第 4 周：六张卡片都收起，作为回顾
  return ids.map(g=>cardHtml(g, numToIso(n)===GRAMMAR[g].intro)).join("");
}

  $("task").innerHTML=h;
  if($("back")) $("back").onclick=()=>{ VIEW=TODAY; renderAll(); };
  $("task").querySelectorAll("textarea[id^='ta_']").forEach(t=>{ const key=t.id.slice(3);
    t.oninput=()=>{ const b=$("task").querySelector(`[data-copy="${key}"]`); S.drafts[key]=t.value; $("wc_"+key).textContent=wc(t.value)+" 词 · 建议 "+b.dataset.goal; save(); }; });
  $("task").querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{
    const key=b.dataset.copy, txt=$("ta_"+key).value.trim();
    if(!txt){ $("cp_"+key).textContent="还没写内容，先写完再复制。"; return; }
    copy(`【${b.dataset.title}】\n题目：${b.dataset.prompt}\n\n我写的（${wc(txt)} 词）：\n${txt}`, $("cp_"+key), $("ta_"+key)); });
  $("task").querySelectorAll("[data-timer]").forEach(b=>b.onclick=()=>startTimer(b.dataset.timer, +b.dataset.min, b));
  if(p) p.x.forEach(x=>{ if(x.type==="set") startBas(SETS[x.date].bas); });
}
const timers={};
function startTimer(key, min, btn){
  clearInterval(timers[key]); const end=Date.now()+min*60000; const el=$("t_"+key); btn.textContent="重新计时";
  const tick=()=>{ const left=Math.round((end-Date.now())/1000); const a=Math.abs(left);
    el.textContent=(left<0?"超时 ":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0"); el.classList.toggle("over",left<0); };
  tick(); timers[key]=setInterval(tick,1000);
}
function copy(text, msgEl, ta){
  try{ navigator.clipboard.writeText(text).then(()=>{ msgEl.textContent="已复制，去对话里粘贴发给我。"; },()=>fallback()); }catch(e){ fallback(); }
  function fallback(){ if(ta){ ta.focus(); ta.select(); } msgEl.textContent="这里不能自动复制，请长按全选文字，手动复制后发给我。"; }
}

/* ---------- 复习 ---------- */
function dueReviews(){
  const out=[];
  for(const p of PIECES){ const d0=isoToNum(p.date);
    STAGES.forEach(([off,name],s)=>{ const due=shift(d0+off), k=p.id+":"+s;
      if(due<=TODAY && !S.done[k]) out.push({kind:"piece",p,s,name,due,k}); }); }
  return out.sort((a,b)=>a.due-b.due);
}
function errorTable(p){ return `<div class="tablewrap"><table><tr><th>你写的</th><th>改为</th><th>要点</th></tr>${p.errors.map(r=>`<tr><td class="en">${esc(r[0])}</td><td class="en">${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</table></div>`; }
function renderReviews(){
  const list=dueReviews();
  let h=`<div class="row"><h2>今天要复习的</h2><span class="small">${list.length?list.length+" 项":""}</span></div>`;
  if(!list.length) h+=`<p style="margin:0" class="small">没有到期的复习。</p>`;
  list.forEach((r,i)=>{
    const late=r.due<TODAY?`<span class="tag warn">已到期 ${TODAY-r.due} 天</span>`:"";
    h+=`<details ${i===0?"open":""}><summary>${esc(r.p.title)} · 第 ${r.s+1} 次：${r.name} ${late}</summary><div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">`;
    if(r.s===0){ h+=errorTable(r.p)+`<div><b>要记住的：</b>${r.p.patterns.map(esc).join("；")}</div>`; }
    else{ h+=`<div class="prompt en">${esc(r.p.prompt)}</div><textarea id="rv_${i}" aria-label="凭记忆重写" placeholder="遮住修改版，凭记忆重写…" style="min-height:180px">${esc(S.drafts["rv:"+r.k]||"")}</textarea>
      <div class="actions"><button id="rvs_${i}">写完了，对照修改版</button></div><div id="rvm_${i}"></div>`; }
    h+=`<div class="actions"><button class="primary" id="rvd_${i}">完成这项复习</button></div></div></details>`;
  });
  $("reviews").innerHTML=h;
  list.forEach((r,i)=>{
    $("rvd_"+i).onclick=()=>{ S.done[r.k]=TODAY; save(); renderAll(); };
    if(r.s>0){ $("rv_"+i).oninput=e=>{ S.drafts["rv:"+r.k]=e.target.value; save(); };
      $("rvs_"+i).onclick=()=>{ $("rvm_"+i).innerHTML=`<div class="small">修改版：</div><div class="model en">${esc(r.p.final)}</div>${errorTable(r.p)}`; }; }
  });
}

/* ---------- 作文库与日程 ---------- */
function renderArchive(){
  $("archive").innerHTML = PIECES.slice().reverse().map(p=>{
    const st=STAGES.map((x,s)=>S.done[p.id+":"+s]?`<span class="tag good">复习 ${s+1} ✓</span>`:`<span class="tag">复习 ${s+1}：${label(shift(isoToNum(p.date)+x[0]))}</span>`).join(" ");
    return `<details><summary>${esc(p.title)} · ${p.date.slice(5).replace("-","/")}</summary><div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
      <div class="actions">${st}</div><div class="small">题目</div><div class="prompt en">${esc(p.prompt)}</div>
      <div class="small">修改版</div><div class="model en">${esc(p.final)}</div>${errorTable(p)}
      <div><b>要记住的：</b>${p.patterns.map(esc).join("；")}</div></div></details>`; }).join("") || `<p class="small">还没有批改过的作文。</p>`;
}
function xLabel(x, w){
  if(x.type==="email") return EMAILS[x.id].title+`（${MINUTES[w].email} 分钟）`; if(x.type==="disc") return DISCUSSIONS[x.id].title+`（${MINUTES[w].disc} 分钟）`;
  if(x.type==="note") return "诊断测试"; if(x.type==="set") return SETS[x.date].title+"（23 分钟）"; return ""; }
function planLabel(iso){ const p=PLAN[iso]; if(!p) return "—"; return p.x.map(x=>xLabel(x,p.w)).filter(Boolean).join(" + "); }
function renderSched(){
  let h=`<tr><th>日期</th><th>周</th><th>内容</th><th></th></tr>`;
  for(let n=isoToNum("2026-11-02"); n<=isoToNum("2026-11-28"); n++){
    const iso=numToIso(n), rest=isRest(n), p=PLAN[iso];
    h+=`<tr class="${n===TODAY?"today":""}"><td style="white-space:nowrap">${label(n)}</td><td style="white-space:nowrap">${p?WEEKS[p.w]:""}</td><td>${rest?"休息":esc(planLabel(iso))}</td><td>${p?`<button data-open="${n}">打开</button>`:""}</td></tr>`;
  }
  $("sched").innerHTML=h;
  $("sched").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ VIEW=+b.dataset.open; renderTask(); window.scrollTo({top:0,behavior:"smooth"}); });
}
function renderIssues(){
  const list=ISSUES.slice().sort((a,b)=>b.count-a.count);
  $("issues").innerHTML=`<div class="row"><h2>我的常见问题</h2><span class="small">更新于 ${ISSUES_UPDATED.slice(5).replace("-","/")} · 按出现次数排序</span></div>
  <div class="prompt"><b>交稿前自查清单</b><ol style="margin:6px 0 0;padding-left:20px">${CHECKLIST.map(c=>`<li>${esc(c)}</li>`).join("")}</ol></div>
  ${list.map((x,i)=>`<details ${i<2?"open":""}><summary>${esc(x.name)} <span class="tag ${x.count>=3?"warn":""}">${x.count} 次</span></summary>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px"><div>${esc(x.rule)}</div>
    <div class="tablewrap"><table><tr><th>你写的</th><th>改为</th></tr>${x.examples.map(e=>`<tr><td class="en">${esc(e[0])}</td><td class="en">${esc(e[1])}</td></tr>`).join("")}</table></div></div></details>`).join("")}`;
}
function renderAll(){
  const d=new Date(); $("today").textContent=`${d.getMonth()+1}月${d.getDate()}日 周${"日一二三四五六"[d.getDay()]}`;
  renderTask(); renderReviews(); renderIssues(); renderArchive(); renderSched();
}
renderAll();
</script>
